# Gate the plugin candy against the pinned charly.
#
# The candy step is the STOCK `charly box validate` at the repo root, and it is real here
# because this repo carries a root charly.yml with a `discover:` block — without one a
# plugin repo is "project-less", charly scans no candies, and the step exits 0 on any
# manifest (opencharly/charly#459). The Go steps below are the other half: building,
# vetting and testing the module is the substance of a plugin repo, which the stock
# template omits entirely.
name: candy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: candy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the pinned charly source (CI-time temp checkout)
        run: |
          git clone --depth 1 --branch v2026.241.1535 https://github.com/opencharly/charly.git /tmp/charly

      - uses: actions/setup-go@v5
        with:
          go-version-file: /tmp/charly/charly/go.mod
          cache-dependency-path: /tmp/charly/charly/go.sum

      - name: Build the charly binary from the pinned checkout
        run: |
          mkdir -p /tmp/charly/bin
          cd /tmp/charly/charly && go build -buildvcs=false -ldflags "-X main.BuildCalVer=candy-ci" -o /tmp/charly/bin/charly .

      - name: The candy manifest validates at the pinned charly
        run: |
          /tmp/charly/bin/charly box validate

      - name: The plugin module builds, vets and tests
        run: |
          cd candy/plugin-punktfunk
          GOWORK=off go build ./...
          GOWORK=off go vet ./...
          GOWORK=off go test ./...

      - name: gofmt is clean
        run: |
          cd candy/plugin-punktfunk
          test -z "$(gofmt -l .)" || { echo "gofmt found unformatted files:"; gofmt -l .; exit 1; }
