version: 2026.240.1943
plugin-punktfunk:
    candy:
        version: 2026.241.1845
        description: |-
            OUT-OF-TREE charly plugin serving the `punktfunk` check verb — a standalone Go
            module driving a running punktfunk streaming host through its management REST
            API (bearer token over HTTPS on 47990), served OUT-OF-PROCESS over go-plugin
            gRPC via the charly plugin SDK. charly's loader fetches this candy's repo,
            go-builds the provider binary on the HOST, and serves it via LocalTransport, so
            an authored `punktfunk:` step dispatches through the provider registry exactly
            like a built-in.

            The verb both PROBES a host (health, status, diagnostics, compositors, gpus,
            paired clients, pending devices, library, virtual displays, plugins, hooks,
            actions) and MANAGES one (arm or disarm pairing, approve or deny a pending
            device, submit a PIN, rename, set an access preset, unpair, toggle a library
            scanner, release virtual displays, invoke a power action, end a game). Mutating
            methods are refused in a `check:` step and must be authored as `run:` steps, so
            a probe can never silently unpair a device or reboot a machine.

            It is NOT a re-skin of the generic `http:` verb. `http:` already covers URL +
            status + body/header matchers, and this plugin exists for the three things it
            structurally cannot do: TOKEN DISCOVERY (the per-host bearer token is generated
            at first start and lives at ~/.config/punktfunk/mgmt-token INSIDE the venue, so
            it is read over the reverse channel, not from an authored URL); ENDPOINT
            RESOLUTION (cc.ResolveEndpoint means one authored step works unchanged against
            a pod's published port and a VM's forwarded one); and DOMAIN SEMANTICS (methods
            map to endpoints and return real verdicts, with `json_path:` to assert one
            field instead of pattern-matching a JSON blob). The `events` method subscribes
            to the SSE lifecycle stream and waits for N matching events, which is the only
            way to assert a TRANSITION — a poll of /api/v1/host can observe a state but
            never that a stream started.

            TLS verification is OFF by default and the flag is spelled `verify_tls` rather
            than `insecure` on purpose: punktfunk serves a self-signed certificate, and a
            plain bool cannot distinguish "unset" from "false", so the field is inverted to
            make the ZERO VALUE the correct default.

            The R10 consumer is a punktfunk-bearing bed (pod or VM) whose check composes
            this plugin alongside the `punktfunk` candy from opencharly/layer-punktfunk.
        plugin:
            source: github.com/opencharly/plugin-punktfunk/candy/plugin-punktfunk
            providers:
                - verb:punktfunk
            primary:
                punktfunk: method
        plan:
            - check: the punktfunk verb dispatches through the provider registry and the host's management API reports itself live (the unauthenticated health route, so the probe works before a bearer token exists)
              id: punktfunk-verb-dispatches
              # MAP form, not the scalar shorthand: plugin.primary: is ignored for an
              # @github-pinned candy, and the shorthand then fails the parse for every bed
              # sharing the project closure (opencharly/charly#471).
              punktfunk:
                method: health
              eventually: 60s
              retry_interval: 5s
              context:
                - runtime

punktfunk-skill:
    skill:
        name: punktfunk
        family: check
        owner: plugin-punktfunk
        description: |-
            the `punktfunk:` check verb — probe AND manage a running punktfunk streaming
            host over its management REST API (health, status, diagnostics, compositors,
            gpus, pairing, clients, library, virtual displays, plugins, hooks, actions, and
            a bounded SSE event subscription), served out-of-process by plugin-punktfunk.
        triggers:
            - "the `punktfunk:` check verb / probing or managing a punktfunk streaming host from a candy or box plan"
        content: |
            # punktfunk — streaming-host check verb

            ## Overview

            `punktfunk:` drives a running [punktfunk](https://git.unom.io/unom/punktfunk)
            host through its management REST API. It both **probes** a host and **manages**
            one, served out-of-process over go-plugin gRPC by
            `opencharly/plugin-punktfunk`.

            Install the host itself with `/charly-punktfunk:punktfunk-host`.

            ## Why it is not the `http:` verb

            `http:` already does URL + status + body/header matchers. This verb exists for
            what `http:` structurally cannot do:

            - **Token discovery.** The bearer token is generated per host at first start and
              lives at `~/.config/punktfunk/mgmt-token` **inside the venue**. An authored
              `http:` step cannot read a per-deploy secret out of a container or guest.
              (The file is an env-file line, `PUNKTFUNK_MGMT_TOKEN=…`, not a bare token —
              sending the raw line yields a clean 401.)
            - **Domain semantics.** Methods map to endpoints and return real verdicts, with
              `json_path:` to assert one field instead of pattern-matching a JSON blob.
            - **`events`.** A bounded SSE subscription is the only way to assert a
              *transition*; polling `/api/v1/host` observes a state, never that a stream
              started.

            ## The request runs INSIDE the venue

            punktfunk binds the management API to loopback by design (the web console is the
            network-facing surface). A host-vantage request cannot reach a loopback-bound
            listener in a container, and the two ways to make it reachable — republishing
            the port or a socat relay — would weaken exactly that posture. So the verb
            issues its request in-venue over the reverse channel, which also puts it on the
            same side as the token. **`curl` must exist in the venue**; its absence is
            reported as such.

            ## Methods

            | Group | Methods |
            |---|---|
            | host / health | `health` `status` `diagnostics` `diagnostics-refresh` `compositors` `gpus` `plugins` `hooks` |
            | native pairing | `pair-status` `pair-arm` `pair-disarm` `pending` `approve` `deny` `pin` |
            | paired clients | `clients` `rename` `access` `unpair` |
            | library | `library` `scanners` `scanner-toggle` |
            | virtual displays | `display-state` `display-monitors` `display-settings` `display-release` |
            | lifecycle | `actions` `action-invoke` `end-game` |
            | stream | `events` |

            ### Client methods — the headless `punktfunk` CLI

            The groups above are the HOST management API. These are the CLIENT half, served
            by the headless `punktfunk` CLI that every Linux client package ships, so a
            fleet bed can drive both ends of a stream in charly verbs instead of shelling
            out to `command:`.

            | Group | Methods |
            |---|---|
            | saved hosts | `hosts-list` (`probe:`) `hosts-add` `hosts-forget` |
            | enrolment | `pair` (`pin:`) |
            | streaming | `launch` (`game:`) `open` (`auto_approve:`) `speed-test` |
            | client-side reads | `client-library` `reachable` `profiles-list` |
            | maintenance | `wake` `client-reset` |

            They take `host:` — the documented `<host-ref>`, a saved name or `host[:port]` —
            and run inside the venue where `punktfunk-client` is installed. `client_bin:`
            overrides the binary for the Flatpak build, which is not on PATH.

            **The PIN travels on stdin, never argv.** Upstream documents `--pin <value>` as
            visible in the process list and `--pin -` as the scripting form; `pair` uses the
            latter. Omitting `pin:` selects the console-approval flow instead, where the
            client requests and a `punktfunk: approve` step on the host completes it — which
            is the flow an automated fleet bed wants, because no secret crosses the member
            boundary.

            **Exit codes are mapped, not collapsed.** The CLI documents `0` success,
            `2` connection failed, `3` trust rejected (re-pair needed), `4` renderer startup
            failed, `5` no match for the reference, `6` interactive action required. Each
            becomes a distinct verdict message, so a bed reports *which* thing broke rather
            than that something did. `6` is the one to watch in automation: it means the CLI
            wanted a human, i.e. the unattended contract is broken.

            `health` is the only unauthenticated route, so it works before a token exists —
            which makes it the right first probe on a fresh host.

            **Mutating methods are refused in a `check:` step.** `pair-arm`, `approve`,
            `deny`, `unpair`, `rename`, `access`, `scanner-toggle`, `display-release`,
            `action-invoke`, `end-game`, `pin` and `diagnostics-refresh` change host state
            and must be authored as `run:` steps, so a probe can never silently unpair a
            device or reboot a machine.

            ## Input fields

            | Field | Meaning |
            |---|---|
            | `method` | the operation. Author it in MAP form (`punktfunk: {method: status}`) - see the note below on scalar shorthand |
            | `port` | management API port (default 47990) |
            | `token` / `token_file` | override the bearer; default is `~/.config/punktfunk/mgmt-token` in the venue |
            | `verify_tls` | require a verifiable chain. **Default off** — punktfunk serves a self-signed cert. Named this way (not `insecure`) so the ZERO VALUE is the correct default, which a bool could not express otherwise. |
            | `fingerprint` / `pending_id` / `action_id` / `provider_id` | the target of a per-entity method |
            | `name` / `access` / `pin` / `enabled` | payloads for rename / access / pin / scanner-toggle |
            | `kinds` / `count` / `event_timeout` | the `events` subscription window |
            | `json_path` | dotted path into the response; stdout becomes that value |

            ## Author in MAP form, not scalar shorthand

            ```yaml
            punktfunk:                 # correct
              method: status

            punktfunk: status          # FAILS the project parse today
            ```

            The plugin declares `plugin.primary: {punktfunk: method}`, which is supposed to
            make the scalar shorthand work before any plugin connects. It does when the
            candy is discovered locally, and is **silently ignored when the candy comes from
            an `@github` ref** — which is how every real consumer pins it. The parse then
            rejects the step:

            ```
            plugin verb "punktfunk" takes a MAP input
            (it declares no primary field for the scalar shorthand)
            ```

            That failure is **not local to the offending step**: it blocks the parse for
            every bed sharing the project closure. Authoring `punktfunk: health` in one bed
            took down three unrelated beds until it was rewritten.

            Tracked as opencharly/charly#471. Until it is fixed, always use the map form.

            ## Examples

            ```yaml
            # Liveness, before any token exists.
            - check: the host's management API reports itself live
              punktfunk:
                method: health
              stdout: [{contains: '"status":"ok"'}]
              eventually: 90s
              retry_interval: 5s
              context: [runtime]

            # Assert ONE field instead of matching a blob.
            - check: the host reports ok
              punktfunk:
                method: health
                json_path: status
              stdout: [{equals: ok}]
              context: [runtime]

            # Managing is a run: step, never a check:.
            - run: arm native pairing so a device can enrol
              punktfunk:
                method: pair-arm

            # Wait for a TRANSITION rather than polling a state.
            - check: a stream actually started
              punktfunk:
                method: events
                kinds: "stream.started"
                count: 1
                event_timeout: 60s
              context: [runtime]
            ```

            ## Cross-References

            - `/charly-punktfunk:punktfunk-host` — the candy that installs the host
            - `/charly-check:check` — the check orchestrator, beds and the R10 sequence
            - `/charly-internals:plugin` — the out-of-process plugin model this verb follows
